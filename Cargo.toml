[package]
name = "sway-configurator"
version = "0.1.0"
edition = "2021"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "0.8"
tracing = "0.1"
tracing-subscriber = "0.3"
which = "6"
gtk4 = { version = "0.9", features = ["v4_14"], optional = true }
libadwaita = { version = "0.7", features = ["v1_5"], optional = true }

[features]
default = ["gtk"]
gtk = ["dep:gtk4", "dep:libadwaita"]

[dev-dependencies]
tempfile = "3.8"

[[test]]
name = "model_roundtrip"
path = "tests/model_roundtrip.rs"

[[test]]
name = "store_integration"
path = "tests/store_integration.rs"

[[test]]
name = "settings_integration"
path = "tests/settings_integration.rs"

[[test]]
name = "sway_detection"
path = "tests/sway_detection.rs"

[[test]]
name = "feature_settings"
path = "tests/feature_settings.rs"
