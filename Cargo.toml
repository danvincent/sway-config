[package]
name = "sway-config"
version = "0.1.0"
edition = "2021"
description = "GTK4/libadwaita GUI for configuring Sway and Waybar"
license = "MIT"
readme = "README.md"
repository = "https://github.com/danvincent/sway-config"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "0.8"
tracing = "0.1"
tracing-subscriber = "0.3"
which = "6"
gtk4 = { version = "0.9", features = ["v4_14"], optional = true }
libadwaita = { version = "0.7", features = ["v1_5"], optional = true }

[features]
default = ["gtk"]
gtk = ["dep:gtk4", "dep:libadwaita"]

[dev-dependencies]
tempfile = "3.8"

[package.metadata.deb]
maintainer = "Daniel Vincent"
copyright = "2026, Daniel Vincent"
depends = "$auto, sway, waybar"
section = "utils"
priority = "optional"
assets = [
  ["target/release/sway-config", "usr/bin/", "755"],
  ["packaging/sway-config.desktop", "usr/share/applications/", "644"],
  ["packaging/sway-config.svg", "usr/share/icons/hicolor/scalable/apps/sway-config.svg", "644"],
  ["README.md", "usr/share/doc/sway-config/README.md", "644"],
  ["LICENSE", "usr/share/doc/sway-config/LICENSE", "644"],
]

[[test]]
name = "model_roundtrip"
path = "tests/model_roundtrip.rs"

[[test]]
name = "store_integration"
path = "tests/store_integration.rs"

[[test]]
name = "settings_integration"
path = "tests/settings_integration.rs"

[[test]]
name = "sway_detection"
path = "tests/sway_detection.rs"

[[test]]
name = "feature_settings"
path = "tests/feature_settings.rs"
