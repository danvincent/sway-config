name: Main Build, Test, Publish

on:
  push:
    branches:
      - main

jobs:
  build-test-publish:
    name: Build, test, package
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgtk-4-dev \
            libadwaita-1-dev \
            libpango1.0-dev \
            libcairo2-dev \
            libgdk-pixbuf-2.0-dev \
            libgraphene-1.0-dev \
            xvfb \
            pkg-config \
            build-essential

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Install packaging tools
        run: |
          sudo apt-get install -y rpm
          cargo install cargo-deb --version 3.7.0 --locked
          cargo install cargo-generate-rpm --version 0.15.2 --locked

      - name: Test (no GTK)
        run: cargo test --locked --no-default-features

      - name: Test (GTK UI)
        env:
          GDK_BACKEND: x11
        run: xvfb-run -a cargo test --locked --features gtk --test gtk_ui_integration -- --test-threads=1

      - name: Build release binary
        run: cargo build --release --locked

      - name: Build Debian package
        run: cargo deb --no-build

      - name: Build RPM package
        run: cargo generate-rpm --auto-req

      - name: Prepare Arch package sources
        run: |
          VERSION=$(grep '^version = ' Cargo.toml | head -1 | cut -d '"' -f2)
          mkdir -p dist/arch
          cp packaging/PKGBUILD dist/arch/
          cp packaging/sway-config.desktop dist/arch/
          cp packaging/sway-config.svg dist/arch/
          git archive --format=tar.gz --prefix=sway-config-${VERSION}/ -o dist/arch/sway-config-${VERSION}.tar.gz HEAD

      - name: Collect artifacts
        run: |
          mkdir -p dist
          cp target/release/sway-config dist/
          cp target/debian/*.deb dist/
          cp target/generate-rpm/*.rpm dist/
          cp packaging/sway-config.spec dist/

      - name: Publish artifacts
        uses: actions/upload-artifact@v4
        with:
          name: sway-config-main-${{ github.sha }}
          path: dist/**
          if-no-files-found: error
